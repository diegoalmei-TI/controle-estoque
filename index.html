<!DOCTYPE html> 
<html lang="pt-BR"> 
<head>   
<script>// Bom dia professor, aqui está configurado o idioma 
padrão da página  
//e o charset UTF-8 para garantir que nenhum texto ou acento 
fique quebrado na tela.</script> 
<meta charset="UTF-8"> 
     
<script>// Aqui esta tag viewport para que o nosso layout seja 
consiga responder bem, 
// se adaptando bem e funcionando tanto para celular quanto no 
monitor.</script> 
<meta name="viewport" content="width=device-width, initial
scale=1.0"> 
     
<title>Controle de Produtos e Estoque</title> 
     
<script>// Aqui  foi feito a importação do  arquivo 'style.css' 
para separar totalmente 
// a estrutura do HTML da parte da estilização visual.</script> 
<link rel="stylesheet" href="style.css"> 
</head> 
 
<body> 
<header>  
<script>// Este é o cabeçalho principal, onde eu coloco o título 
em  
//destaque no topo do nosso sistema de estoque.</script> 
<h1>Sistema de Controle de Estoque</h1> 
</header> 
 
<main>
    <script>//  Esta seção principal para agrupar o formulário onde 
foi capturado todos 
// os dados que vão gerar o nosso objeto de produto.</script> 
<section id="cadastro-container"> 
<h2>Cadastrar Novo Produto</h2> 
<form id="form-produto"> 
                 
<script>// Usei este input oculto 'hidden' para guardar o ID do 
produto que vem do MySQL.  
    //Ele fica invisível para o usuário, mas o JavaScript usa 
para controle de chaves primárias.</script> 
<input type="hidden" id="produto-id"> 
 
<script>// Professor, todos os  campos de digitação abaixo 
possuem o atributo 'required'  
 //para forçar a validação e não permitir envios em 
branco.</script> 
<div> 
<label for="nome">Nome do Produto:</label> 
<input type="text" id="nome" required placeholder="Ex: Teclado 
Mecânico"> 
</div> 
 
<div>     
<label for="categoria">Categoria:</label> 
<input type="text" id="categoria" required placeholder="Ex: 
Informática"> 
</div> 
 
<div>  
<script>// No preço,aqui pedicpara travar com 'step="0.01"' e 
'min="0"' para aceitar apenas  
//números decimais positivos, simulando perfeitamente uma entrada 
de dinheiro.</script> 
<label for="preco">Preço Unitário (R$):</label> 
<input type="number" id="preco" step="0.01" min="0" required 
placeholder="0.00"> 
</div> 
 
<div> 
<label for="quantidade">Quantidade em Estoque:</label> 
<input type="number" id="quantidade" min="0" required 
placeholder="0"> 
</div> 
 
<div> 
<label for="fornecedor">Fornecedor:</label> 
<input type="text" id="fornecedor" required placeholder="Ex: 
Distribuidora Tech"> 
</div> 
 
<script>// Quando o usuário clica neste botão, ele dispara o 
envio do formulário,
        
// que eu intercepto lá no script.js para mandar para o 
servidor.</script> 
<button type="submit" id="btn-salvar">Salvar Produto</button> 
</form> 
</section> 
 
<script>// Esta seção foi montada para o Desafio JavaScript.  
//Aqui está o span do valor total zerado, porque ele serve de 
alvo para o script colocar 
// a soma totalizadora em tempo real.</script> 
<section id="painel-financeiro"> 
<h3>Resumo Financeiro do Estoque</h3> 
<p>Valor Total em Estoque: <strong>R$ <span id="valor-total
estoque">0.00</span></strong></p> 
</section> 
 
<script>// Aqui fica a área de listagem e gerenciamento de dados 
do sistema.</script> 
<section id="listagem-container"> 
<h2>Produtos Cadastrados</h2> 
             
<script>// Este é  o input de busca dinâmica para o filtro em 
tempo real.  
//Conforme o usuário digita aqui, o JavaScript esconde as linhas 
que não batem com a pesquisa.</script> 
<div style="margin-bottom: 15px;"> 
<label for="busca">    Pesquisar Produto (Nome ou 
Categoria):</label> 
<input type="text" id="busca" placeholder="Digite para 
filtrar..." style="width: 100%; max-width: 400px;"> 
</div> 
 
<script>// No 'thead' estão os títulos fixos e o 'tbody'  
//eu deixei vazio mesmo porque as linhas com as informações do 
banco serão geradas pelo JavaScript.</script> 
<table id="tabela-produtos"> 
<thead> 
<tr> 
<th>ID</th> 
<th>Nome</th> 
<th>Categoria</th> 
<th>Preço</th> 
<th>Qtd. Estoque</th> 
<th>Fornecedor</th> 
<th>Ações</th> 
</tr> 
</thead> 
<tbody id="corpo-tabela"> 
</tbody> 
</table> 
</section> 
</main> 
 
<footer> 
<p>&copy; 2026 - Projeto Final Ferramentas Web I</p> 
</footer> 
 
<script>// Por fim, aqui foi chamado o arquivo 'script.js' bem no 
final do body  
//para garantir que o navegador monte toda a tela antes de rodar 
qualquer lógica lógica de programação.</script> 
<script src="script.js"></script> 
     
</body> 
</html>
