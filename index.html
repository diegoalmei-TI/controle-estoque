<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Gerenciamento de Controle de Estoque</h1>

        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro" class="form-cadastro">
                <input type="text" id="nome" placeholder="Nome do Produto" required>
                <input type="text" id="categoria" placeholder="Categoria" required>
                <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" required>
                <input type="number" id="quantidade" placeholder="Quantidade" required>
                <input type="text" id="fornecedor" placeholder="Fornecedor" required>
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </form>
        </div>

        <h2>Produtos em Estoque</h2>
        <div class="tabela-container">
            <table id="tabela-produtos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Fornecedor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
        </div>
    </div>

    <div id="modal-edicao" class="modal hidden">
        <div class="modal-content">
            <span class="fechar-modal" onclick="fecharModal()">&times;</span>
            <h2>Editar Produto</h2>
            <form id="form-editar-produto">
                <input type="hidden" id="edit-id">
                
                <label>Nome:</label>
                <input type="text" id="edit-nome" required>
                
                <label>Categoria:</label>
                <input type="text" id="edit-categoria" required>
                
                <label>Preço (R$):</label>
                <input type="number" id="edit-preco" step="0.01" required>
                
                <label>Estoque:</label>
                <input type="number" id="edit-quantidade" required>
                
                <label>Fornecedor:</label>
                <input type="text" id="edit-fornecedor" required>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                    <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
